services:
  split-api:
    build: .
    image: dataset-split-api:latest
    container_name: dataset-split-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/app.db          # SQLite 元数据（含图像 blob 引用与 SHA-256）
      DATA_DIR: /data                      # 图像原字节数据卷：tmp/ staging/ blobs/
      MAX_UNCOMPRESSED_BYTES: "0"          # ZIP 展开总字节上限，0=不限制；可按需收紧
    volumes:
      - split_data:/data   # SQLite + 图像原字节统一持久化，容器重启/重建后已入库文件仍可下载
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  split_data:
